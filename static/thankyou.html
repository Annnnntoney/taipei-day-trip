<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>感謝訂購 - 台北一日遊</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23448899'/%3E%3Ctext x='16' y='23' font-size='20' font-family='sans-serif' font-weight='bold' fill='white' text-anchor='middle'%3E台%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/thankyou.css">
</head>
<body>
  <!-- ============ 導覽列（跟其他頁面一致，見 Guide 6-5） ============ -->
  <header class="nav">
    <div class="nav__inner">
      <a class="nav__logo" href="/">台北一日遊</a>
      <nav class="nav__menu">
        <a class="nav__link" href="/booking" id="booking-link">預定行程</a>
        <a class="nav__link" href="#" id="auth-link">登入/註冊</a>
      </nav>
    </div>
  </header>

  <!-- ============ 感謝頁內容 ============ -->
  <main class="thankyou-page">
    <div class="thankyou-page__inner">
      <h1 class="thankyou-page__title" id="thankyou-title">感謝您的訂購！</h1>
      <p class="thankyou-page__number">訂單編號：<span id="order-number"></span></p>

      <!-- 訂單細節：需要登入才問得到 GET /api/order/{number}，問不到就只顯示上面的訂單編號 -->
      <div class="thankyou-page__detail" id="order-detail" hidden>
        <p class="thankyou-page__row"><span class="thankyou-page__label">景點：</span><span id="order-attraction"></span></p>
        <p class="thankyou-page__row"><span class="thankyou-page__label">日期：</span><span id="order-date"></span></p>
        <p class="thankyou-page__row"><span class="thankyou-page__label">時間：</span><span id="order-time"></span></p>
        <p class="thankyou-page__row"><span class="thankyou-page__label">費用：</span><span id="order-price"></span></p>
        <p class="thankyou-page__row"><span class="thankyou-page__label">付款狀態：</span><span id="order-status"></span></p>
      </div>

      <a class="thankyou-page__home-link" href="/">回首頁繼續逛逛</a>
    </div>
  </main>

  <!-- ============ 頁尾 ============ -->
  <footer class="footer">
    COPYRIGHT © 2021 台北一日遊
  </footer>

  <script src="/static/auth.js"></script>
  <script src="/static/thankyou.js"></script>
</body>
</html>
