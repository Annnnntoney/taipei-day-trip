<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>預定行程 - 台北一日遊</title>
  <!-- 內嵌 SVG 圖示：避免瀏覽器自動請求 /favicon.ico 而得到 404 -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23448899'/%3E%3Ctext x='16' y='23' font-size='20' font-family='sans-serif' font-weight='bold' fill='white' text-anchor='middle'%3E台%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/booking.css">
</head>
<body>
  <!-- ============ 導覽列 ============ -->
  <header class="nav">
    <div class="nav__inner">
      <a class="nav__logo" href="/">台北一日遊</a>
      <nav class="nav__menu">
        <a class="nav__link" href="/booking" id="booking-link">預定行程</a>
        <!-- 文字與行為由 auth.js 控制：未登入顯示「登入/註冊」開彈窗，已登入變「登出系統」 -->
        <a class="nav__link" href="#" id="auth-link">登入/註冊</a>
      </nav>
    </div>
  </header>

  <!-- ============ 預定行程內容 ============ -->
  <main class="booking-page">
    <div class="booking-page__inner">

      <h1 class="booking-page__greeting" id="greeting">待預訂的行程如下：</h1>

      <!-- 有預定行程資料時顯示 -->
      <div class="booking-page__content" id="booking-content" hidden>

        <!-- 預定卡片：圖片＋景點資訊＋刪除鈕 -->
        <div class="booking-item">
          <img class="booking-item__image" id="booking-image" alt="">

          <div class="booking-item__info">
            <p class="booking-item__name" id="booking-name"></p>
            <p class="booking-item__row">日期：<span id="booking-date"></span></p>
            <p class="booking-item__row">時間：<span id="booking-time"></span></p>
            <p class="booking-item__row">費用：<span id="booking-price"></span></p>
            <p class="booking-item__row">地址：<span id="booking-address"></span></p>
          </div>

          <!-- Part 5-5 步驟 3：刪除按鈕 -->
          <button type="button" class="booking-item__delete" id="delete-btn" aria-label="刪除預定行程">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
              <path fill="none" stroke="#666" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    d="M4 7h16M9 7V4h6v3m-8 0 1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13"/>
            </svg>
          </button>
        </div>

        <!-- 聯絡資訊：讀取自登入會員資料，手機號碼供使用者填寫 -->
        <section class="booking-section">
          <h2 class="booking-section__title">您的聯絡資訊</h2>
          <div class="booking-field">
            <span class="booking-field__label">聯絡姓名：</span>
            <span id="contact-name"></span>
          </div>
          <div class="booking-field">
            <span class="booking-field__label">聯絡信箱：</span>
            <span id="contact-email"></span>
          </div>
          <div class="booking-field">
            <label class="booking-field__label" for="contact-phone">手機號碼：</label>
            <input class="booking-field__input" type="tel" id="contact-phone" placeholder="請輸入手機號碼">
          </div>
          <p class="booking-section__note">
            請保持手機暢通，導遊人員將以此號碼與您確認行程狀況，本公司將完全保障您的個資安全。
          </p>
        </section>

        <!-- 信用卡付款資訊：視覺呈現用，付款串接留待之後的課程進度 -->
        <section class="booking-section">
          <h2 class="booking-section__title">信用卡付款資訊</h2>
          <div class="booking-field">
            <label class="booking-field__label" for="card-number">卡片號碼：</label>
            <input class="booking-field__input" type="text" id="card-number" placeholder="•••• •••• •••• ••••">
          </div>
          <div class="booking-field">
            <label class="booking-field__label" for="card-expiry">到期日期：</label>
            <input class="booking-field__input booking-field__input--small" type="text" id="card-expiry" placeholder="MM / YY">
          </div>
          <div class="booking-field">
            <label class="booking-field__label" for="card-cvv">安全碼：</label>
            <input class="booking-field__input booking-field__input--small" type="text" id="card-cvv" placeholder="CVV">
          </div>
        </section>

        <div class="booking-page__total">
          <p class="booking-page__total-amount">總金額：<span id="total-price"></span></p>
          <button type="button" class="booking-page__pay-btn">確認訂單並付款</button>
        </div>
      </div>

      <!-- Part 5-5 步驟 2：沒有預定行程資料時顯示 -->
      <p class="booking-page__empty" id="empty-message" hidden>沒有預定行程</p>

    </div>
  </main>

  <!-- ============ 頁尾 ============ -->
  <footer class="footer">
    COPYRIGHT © 2021 台北一日遊
  </footer>

  <script src="/static/auth.js"></script>
  <script src="/static/booking.js"></script>
</body>
</html>
